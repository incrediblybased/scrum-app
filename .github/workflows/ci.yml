name: Simple CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "SCRUM-*" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Copy code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Test the code
        run: npm test
